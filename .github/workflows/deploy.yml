name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vercel deploys automatically on push to main via GitHub integration,
      # but this workflow gives you build-time validation and status reporting.
      # The Vercel GitHub App handles the actual deploy.
      - name: Notify Vercel
        run: |
          echo "✅ Vercel will auto-deploy from this push to main"
          echo "   Monitor at: https://vercel.com/dashboard"
